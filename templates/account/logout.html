{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %} {% trans "Sign Out" %} {% endblock %}

{% block content %}

<section class="ab-info-main py-md-5 py-4 editContent">
  <div class="title-entry">
    <h2>Выход</h2>
  </div>
  <div class="lg-entry">
    Вы уверены, что хотите выйти?
  </div>
  <div class="about-block">
    <form method="post" action="{% url 'account_logout' %}">
      <div class="progress-item-entry ">
        <div class="text-title-home-entry" style="max-width: 600px; margin: 0 auto; ">
          {% csrf_token %}
          {% if redirect_field_value %}
          <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
          {% endif %}
        </div>
        <div class="title-entry">
          <button class="btn btn-outline-danger" style="width: calc(33.333% - 16px);max-width: 200px; "
            type="submit">Выйти</button>
          <a href="{% url 'profile' %}" class="btn btn-outline-danger"
            style="width: calc(33.333% - 16px);max-width: 200px; ">Назад</a>
        </div>
      </div>

    </form>
  </div>
</section>
