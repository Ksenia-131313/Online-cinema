{% extends "account/base.html" %}

{% block head_title %}Смена пароля{% endblock %}

{% block content %}
    <h1>Смена пароля</h1>

    <form method="POST" action="{% url 'account_change_password' %}" class="password_change">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" name="action">Смена пароля</button>
    </form>
{% endblock %}
