{% load movie_tag %}

<div class="sidebar-top">
    <div class="catalog-toolbar">

        <!-- Поиск -->
        <form action="{% url 'search' %}" method="get"
              class="catalog-search">
            <input type="search"
                   placeholder="Поиск фильма"
                   name="q"
                   required>
            <button type="submit">
                <span class="fa fa-search" aria-hidden="true"></span>
            </button>
        </form>

        <!-- Фильтр -->
        <details class="catalog-dropdown">
            <summary>Фильтр</summary>

            <form action="{% url 'filter' %}" method="get"
                  class="catalog-dropdown__content">

                <details class="filter-group">
                    <summary>Жанры</summary>

                    {% for genre in view.get_genres %}
                    <label class="catalog-option">
                        <input type="checkbox"
                               name="genre"
                               value="{{ genre.id }}">
                        <span>{{ genre.name }}</span>
                    </label>
                    {% endfor %}
                </details>

                <details class="filter-group">
                    <summary>Год</summary>

                    {% for movie in view.get_years %}
                    <label class="catalog-option">
                        <input type="checkbox"
                               name="year"
                               value="{{ movie.year }}">
                        <span>{{ movie.year }}</span>
                    </label>
                    {% endfor %}
                </details>

                <button type="submit" class="catalog-apply">
                    Применить фильтр
                </button>
            </form>
        </details>

        <!-- Сортировка -->
        <details class="catalog-dropdown">
            <summary>Сортировка</summary>

            <form action="{% url 'home' %}" method="get"
                  class="catalog-dropdown__content">
                <label class="catalog-option">
                    <input type="radio" name="order" value="year">
                    <span>Сначала старые</span>
                </label>

                <label class="catalog-option">
                    <input type="radio" name="order" value="-year">
                    <span>Сначала новые</span>
                </label>
                <label class="catalog-option">
                    <input type="radio" name="order" value="title">
                    <span>По названию (А–Я)</span>
                </label>

                <label class="catalog-option">
                    <input type="radio" name="order" value="-title">
                    <span>По названию (Я–А)</span>
                </label>

                <button type="submit" class="catalog-apply">
                    Сортировать
                </button>
            </form>
        </details>

    </div>
</div>

{% get_last_movies %}
