{% extends 'base.html' %}
{% block content %}
<section class="ab-info-main py-md-5 py-4 editContent">
  <div class="text-title-home" style="flex-wrap: wrap; justify-content: center; display: flex">
    <h1>Удалить фильм "{{ movie.title }}"?</h1>
    
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="about-block">
      <div class="progress-list" style="display: flex; justify-content: center;">
        <a href="{% url 'profile' %}" class="btn btn-outline-danger mt-4"
          style="width: calc(33.333% - 16px);width: 500px; padding: 10px;margin:10px;">Назад
        </a>
        <button type="submit" class="btn mt-4"
          style="width: calc(33.333% - 16px);width: 500px; padding: 10px;margin:10px; background: linear-gradient(rgb(22, 22, 22), rgb(18, 17, 17));">Удалить
        </button>
      </div>
    </div>
  </form>
</section>


{% endblock content %}
